# =============================================================================
# photography_wallpaper_shuffler_v2.sh — 配置文件
#
# 用法：修改下方变量后执行 kill -HUP <pid> 热重载，无需重启脚本。
#       pid 查询：pgrep -a -f wallpaper_shuffler_v2
#
# 格式：KEY=VALUE（不含空格，不含引号）
#       以 # 开头的行为注释，被忽略。
#       只有白名单中的变量名会被接受（安全设计，防止代码注入）。
# =============================================================================


# =============================================================================
# 一、壁纸切换行为
# =============================================================================

# 每张壁纸的展示时长（分钟）
# 推荐：内存充足选 1-2，内存紧张或 NVIDIA 驱动有泄漏风险时选 5-10
INTERVAL=1

# 每张图片最多成功展示的次数，达到阈值后回收/删除
# 调大此值可让每张图片出现更多次再被回收
MAX_SHOW=3

# 回收模式：true=移动到 .recycle 文件夹（可找回）；false=直接删除（不可恢复）
RECYCLE_MODE=true

# 回收/删除操作完成后的节流等待（秒）；设为 0 禁用
POST_DELETE_SLEEP=1


# =============================================================================
# 二、锁屏处理
# =============================================================================

# 锁屏时暂停壁纸切换：true=暂停，false=继续切换（锁屏期间也不计数）
PAUSE_WHEN_LOCKED=true

# 锁屏轮询间隔（秒）：解锁后最多等待此秒数即可恢复
# 值越小恢复越快，CPU 开销越略高（每次 gdbus 调用约 5ms）
# 推荐：2（桌面），5（笔记本节电模式）
LOCK_POLL_INTERVAL=120


# =============================================================================
# 三、播放列表 / 文件扫描
# =============================================================================

# 播放列表定时重建间隔（秒）
# 3600=1h, 10800=3h（默认）, 21600=6h, 43200=12h
# 图片库越大，建议此值越大（减少 find+shuf 频率）
PLAYLIST_REBUILD_INTERVAL=10800

# 是否跟随符号链接目录（find -L）：true/false
# 若图片存放在软链接指向的目录中，须设为 true
FOLLOW_SYMLINKS=true

# find 最大递归深度（防止符号链接循环导致无限递归）
FIND_MAX_DEPTH=20

# 回退目录切换冷却（秒）：主目录空时切换到系统壁纸目录的最小间隔，防止来回抖动
FALLBACK_SWITCH_COOLDOWN=60

# 空列表自适应退避初始等待（秒）
EMPTY_BACKOFF_INITIAL=5

# 空列表自适应退避最大等待（秒）
EMPTY_BACKOFF_MAX=60


# =============================================================================
# 四、错误处理
# =============================================================================

# gsettings 连续失败阈值：当 ERRORCOUNT × INTERVAL 超过此值时脚本退出
# 调大此值让脚本在出错后坚持更久再退出
ERROR_THRESHOLD=20


# =============================================================================
# 五、OOM 自我防护
# （以下阈值单位均为 KB；1MB=1024，1GB=1048576）
# =============================================================================

# gnome-shell 进程 RSS（常驻内存）超过此值时触发限流，降低壁纸切换频率
# gnome-shell 正常使用约 300-800MB；若长期运行内存泄漏可增长到数 GB
# 默认 4GB = 4194304KB
# 推荐（32GB 系统）：4194304
# 推荐（16GB 系统）：3145728（3GB）
# 推荐（8GB  系统）：2097152（2GB）
OOM_GNOME_RSS_MAX_KB=4194304

# 内存不足时每次暂停的秒数（LOW 和 CRITICAL 状态均使用此值）
OOM_PAUSE_SECONDS=60


# =============================================================================
# 六、日志
# =============================================================================

# 日志级别：debug（最详细）| info（默认）| warn（仅警告/错误）| error（仅错误）
LOG_LEVEL=info
